<!DOCTYPE html>
<html>
<head>
  <title>Cadastre-se</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-md col-6" id="principal">
    <form>
      <h2 class="text-center">Endereço</h2>
      <div class="row g-2 mb-3">
        <div class="col-md-5 input-group">
          <span class="input-group-text">CEP</span>
          <input type="text" id="cep" class="form-control" maxlength="8" placeholder="Ex: 86025230">
        </div>
        <div class="col-md-7 input-group">
          <span class="input-group-text">Rua</span>
          <input type="text" id="rua" class="form-control">
        </div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-4 input-group"><span class="input-group-text">Bairro</span><input type="text" id="bairro" class="form-control"></div>
        <div class="col-md-5 input-group"><span class="input-group-text">Cidade</span><input type="text" id="cidade" class="form-control"></div>
        <div class="col-md-3 input-group"><span class="input-group-text">Estado</span><input type="text" id="estado" class="form-control"></div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-6 input-group"><span class="input-group-text">Número</span><input type="text" id="numero" class="form-control" placeholder="Ex: 103"></div>
        <div class="col-md-6 input-group"><span class="input-group-text">Complemento</span><input type="text" id="complemento" class="form-control"></div>
      </div>
      <div class="text-center"><button type="button" class="btn btn-primary">CADASTRAR</button></div>
    </form>
  </div>
  <script src="controller.js"></script>
</body>
</html>
